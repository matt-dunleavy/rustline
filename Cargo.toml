[package]
name = "rustline"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Emacs-style line editor for terminal programs, a Rust port of bestline"
authors = ["Matthew J. Dunleavy <matthewjdunleavy@gmail.com>"]
license = "BSD-2-Clause"
readme = "README.md"
repository = "https://github.com/matt-dunleavy/rustline"
keywords = ["readline", "linenoise", "terminal", "repl", "cli"]
categories = ["command-line-interface", "text-editors"]
# A whitelist, not a blacklist: an exclude list silently ships whatever you
# forget to name. This keeps the reference C, the review notes, and personal
# editor and toolchain configuration out of the published package.
include = [
    "src/**/*.rs",
    "examples/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
nix = { version = "0.30.1", features = ["term", "signal", "poll", "fs", "process"] }
unicode-width = "0.2.1"
thiserror = "2.0.12"
dirs = "6.0"

[dev-dependencies]
proptest = "1"
tempfile = "3.8"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
