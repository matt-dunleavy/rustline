name: ci

on:
  push:
    # Both names, so a rename of the default branch does not silently stop CI.
    branches: [master, main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The integration suite drives the editor through a real pseudoterminal,
      # so the examples must be built before the tests look for them.
      - run: cargo build --all-targets --all-features
      - run: cargo test --all-targets --all-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    # The action only runs `rustup default 1.85.0`, and a rust-toolchain.toml
    # in the working directory overrides the rustup default. Pinning the
    # toolchain here instead means this job checks the MSRV even if someone
    # adds that file back, rather than silently re-testing stable.
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      # Prove the gate is real. The previous version of this job ran on stable
      # and passed whatever the MSRV was.
      - name: verify the pinned toolchain is in use
        run: rustc --version && rustc --version | grep -q '1\.85\.0'
      - run: cargo check --all-features

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `include` in Cargo.toml is a whitelist, so a new file is left out of
      # the crate until someone names it. Print what would ship, then build
      # the package exactly as `cargo publish` would.
      - run: cargo package --list
      - run: cargo package

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
